name: go

# The clients in golang/ are generated from the *_service.json schemas and checked
# in (consumers `go get` the module, so they cannot run the generator themselves).
# A schema change is therefore usually a JSON-only diff by someone who may not even
# have Go installed: this workflow regenerates the clients, commits them back to the
# branch and verifies the regenerated tree in the same run.
#
# Fixing and verifying have to share one run, because a push made with GITHUB_TOKEN
# does not trigger further workflow runs.
#
# Two cases cannot be fixed here and stay a hard error:
#   - the default branch: a schema change gets there through a reviewed PR whose
#     branch was already regenerated by this workflow (and it is protected anyway)
#   - a pull request from a fork: its token is read-only, so the contributor has to
#     run `go generate ./...` and commit the result.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession would otherwise race on the same branch.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The regenerate step commits back; every other step stays read-only.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A pull_request checkout is the synthetic merge commit (detached), so the
          # commit back has to target the head branch instead. For a fork PR that
          # branch only exists in the fork.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.sum

      - name: Regenerate the Go clients
        id: regenerate
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # Only a branch we may push to: not the default branch, and not a fork.
          CAN_COMMIT: >-
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
            || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) }}
        run: |
          go generate ./...
          cd ..
          # Only golang/ is generated; the schema edit itself is the author's commit.
          if git diff --quiet -- golang && [ -z "$(git ls-files --others --exclude-standard -- golang)" ]; then
            echo "::notice::The Go clients already match the service definitions."
            exit 0
          fi
          if [ "$CAN_COMMIT" != "true" ]; then
            git --no-pager diff --stat -- golang
            echo "::error::The Go clients do not match the service definitions and this run must not commit them (default branch or fork). Run 'cd golang && go generate ./...' and commit the result."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- golang
          git commit -m 'chore(golang): regenerate the Go clients from the service definitions'
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push the regenerated clients
        # Separate step so the token never sits in the environment of the step that
        # runs `go generate` on a possibly forked branch.
        if: steps.regenerate.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"; then
            echo "::error::Could not push the regenerated clients to ${BRANCH}. The branch may forbid this token (protected branch) or a concurrent push won the race - push again."
            exit 1
          fi
          echo "::notice::Committed the regenerated Go clients to ${BRANCH}."

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
