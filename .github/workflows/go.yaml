name: go

# Guards the generated Go clients in golang/: a schema change without a
# regenerated client (or a new service without a //go:generate directive) turns
# this workflow red.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
      - name: Regenerate clients
        run: |
          go generate ./...
          # Stage first: plain `git diff` ignores untracked files, so a brand new
          # client would slip through. Whatever the generator changed or added has
          # to be committed already.
          git add -A .
          if ! git diff --cached --exit-code; then
            echo "::error::The Go clients do not match the service definitions - run 'cd golang && go generate ./...' and commit the result."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
